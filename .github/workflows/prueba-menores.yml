name: Prueba de lectura (Letyshops, Klarna y Consupermiso)

# Solo lee y enseña el resultado en el registro; no importa ni publica nada. Se lanza a mano para diagnosticar.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python leer_menores.py
      - run: python -c "import json;r=json.load(open('lectura_menores.json',encoding='utf-8'));print(r['paginas_ok']);print({k:v['pct'] for k,v in r['Klarna'].items()})"
