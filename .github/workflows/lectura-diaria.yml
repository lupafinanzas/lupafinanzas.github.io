name: Lectura diaria (Widilo, Beruby y descuentos)

# Lee Widilo, Beruby, iGraal y TopCashback con scripts de Python (sin navegador), importa los cambios, regenera las páginas y publica.
# Dos tandas al día (mañana completa, tarde ligera). Las lecturas corren EN PARALELO (un trabajo por fuente, cada una con su pausa de 2 s entre páginas); un último trabajo recoge los
# resultados, importa, regenera y publica. Si una fuente falla, las demás siguen.
# No depende del ordenador del usuario. mycashbacks y BestPrice (que solo se leen con navegador) y las tareas con criterio (X, notas,
# pruebas de códigos) siguen en la tarea programada del PC. Los datos que no se renueven en 3 días se retiran solos (purgar_caducados.py).

on:
  schedule:
    - cron: "30 5 * * *"   # tanda de la mañana, completa: 05:30 UTC = 07:30 hora de España (verano) / 06:30 (invierno)
    - cron: "20 15 * * *"  # tanda de la tarde, ligera (sin Beruby ni categorías): 15:20 UTC = 17:20 hora de España (verano)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lectura-diaria
  cancel-in-progress: false

jobs:
  leer_widilo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Leer Widilo
        continue-on-error: true
        run: python leer_widilo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lectura-widilo
          path: |
            cambios_widilo.txt
            fallos_widilo.txt
            descuentos_widilo.txt
          if-no-files-found: ignore

  leer_beruby:
    # Beruby (más de 1.700 páginas) se lee solo una vez al día, en la tanda de la mañana (y en las ejecuciones manuales)
    if: ${{ github.event.schedule != '20 15 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Leer Beruby
        continue-on-error: true
        run: python leer_beruby.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lectura-beruby
          path: |
            cambios_beruby.txt
            fallos_beruby.txt
          if-no-files-found: ignore

  leer_igraal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Leer iGraal
        continue-on-error: true
        run: python leer_igraal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lectura-igraal
          path: |
            cambios_igraal.txt
            fallos_igraal.txt
          if-no-files-found: ignore

  leer_topcashback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Leer TopCashback
        continue-on-error: true
        run: python leer_topcashback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lectura-topcashback
          path: |
            cambios_topcashback.txt
            fallos_topcashback.txt
          if-no-files-found: ignore

  leer_categorias:
    if: ${{ github.event.schedule != '20 15 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Leer categorías (una vez por semana, los domingos, o si faltan)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ ! -f datos/categorias.json ]; then python leer_categorias.py --salida categorias_nueva.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lectura-categorias
          path: categorias_nueva.json
          if-no-files-found: ignore

  publicar:
    needs: [leer_widilo, leer_beruby, leer_igraal, leer_topcashback, leer_categorias]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install beautifulsoup4

      # Recoge los resultados de las lecturas (los que existan) en la carpeta de trabajo
      - uses: actions/download-artifact@v4
        with:
          pattern: lectura-*
          merge-multiple: true
          path: .

      # Importar con lo último del repositorio (el PC puede haber publicado mientras tanto) y publicar
      - name: Importar, regenerar y publicar
        run: |
          git config user.name "lupafinanzas-bot"
          git config user.email "actions@users.noreply.github.com"
          ls -la cambios_*.txt fallos_*.txt categorias_nueva.json 2>/dev/null || echo "Sin archivos de lectura"
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # los .txt de lectura están sin seguimiento y sobreviven al reset
            if [ -f cambios_widilo.txt ]; then
              python importar_widilo.py cambios_widilo.txt --refrescar fallos_widilo.txt || echo "Widilo: importación omitida"
              python importar_descuentos.py descuentos_widilo.txt || echo "Descuentos: importación omitida"
            fi
            if [ -f cambios_beruby.txt ]; then
              python importar_beruby.py cambios_beruby.txt --refrescar fallos_beruby.txt || echo "Beruby: importación omitida"
            fi
            if [ -f cambios_igraal.txt ]; then
              python importar_igraal.py cambios_igraal.txt --refrescar fallos_igraal.txt || echo "iGraal: importación omitida"
            fi
            if [ -f cambios_topcashback.txt ]; then
              python importar_topcashback.py cambios_topcashback.txt --refrescar fallos_topcashback.txt || echo "TopCashback: importación omitida"
            fi
            if [ -f categorias_nueva.json ]; then cp categorias_nueva.json datos/categorias.json; fi
            python purgar_caducados.py --dias 3
            python actualizar_historial.py
            python build_blog.py
            python build_tiendas.py
            python build_plataformas.py
            if [ -f datos/categorias.json ]; then python build_categorias.py; fi
            python prerender.py
            python generar_feed.py
            python validar_cashback.py
            python validar_promos.py
            git add -A
            if git diff --cached --quiet; then echo "Sin cambios que publicar"; exit 0; fi
            git commit -m "Lectura diaria $(date -u +%F): Widilo, Beruby, iGraal, TopCashback, descuentos y páginas regeneradas"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rechazado (alguien publicó a la vez); reintento $intento"
          done
          exit 1

      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: python indexnow.py
